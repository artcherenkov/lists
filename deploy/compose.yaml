name: lists

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    command: caddy run --config /srv/current/Caddyfile --adapter caddyfile
    volumes:
      - /opt/lists:/srv:ro
    # Наружу сайт отдаёт общий прокси сервера (проект ingress): он читает метки и сам держит сертификат
    networks:
      - ingress
    labels:
      caddy: v2.watchlist.acherenkov.com
      caddy.reverse_proxy: "{{upstreams 80}}"
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  ingress:
    external: true
