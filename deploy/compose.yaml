name: lists

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    command: caddy run --config /srv/current/Caddyfile --adapter caddyfile
    volumes:
      - /opt/lists:/srv:ro
    # Наружу сайт отдаёт общий прокси сервера (проект ingress): он читает метки и сам держит сертификат
    networks:
      - ingress
      - default
    labels:
      caddy: v2.watchlist.acherenkov.com
      caddy.reverse_proxy: "{{upstreams 80}}"
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Макет платформы данных (ветка proto/m5-iphone): Postgres и сервер своего движка. Порты наружу не публикуются,
  # Caddy ходит к серверу по имени сервиса через сеть default. Секреты – в /opt/m5 вне /opt/lists: каталог /opt/lists
  # смонтирован в Caddy, который смотрит в интернет. Файлы создаются вручную до первой выкладки, у каждого сервиса свой.
  m5-postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_DB: app
    env_file: /opt/m5/postgres.env
    volumes:
      - m5-pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h: без него проверка идёт через сокет и проходит, пока init образа держит временный сервер без TCP
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  m5-server:
    image: node:24.16.0-alpine
    restart: unless-stopped
    init: true
    user: node
    mem_limit: 128m
    memswap_limit: 128m
    # Бандл – из релиза: /opt/lists смонтирован целиком, current разворачивается при старте контейнера.
    command: ["node", "--max-old-space-size=96", "/srv/current/server/index.mjs"]
    volumes:
      - /opt/lists:/srv:ro
    env_file: /opt/m5/server.env
    environment:
      LISTEN_HOST: 0.0.0.0
      PORT: "13400"
      LAB_USERS: lab
    # Меняется с каждым релизом (подставляет deploy.sh): compose пересоздаёт сервер, и он читает бандл нового релиза.
    labels:
      lists.release: "dev"
    depends_on:
      m5-postgres:
        condition: service_healthy
    healthcheck:
      # wget из busybox, а не node -e: отдельный процесс Node на каждую проверку съедал бы память и CPU соседей
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13400/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  m5-pgdata:

networks:
  ingress:
    external: true
  # Своя сеть проекта: по ней Caddy ходит к серверу макета, а Postgres и сервер не видны соседям по ingress
  default:
