replication:
  connections:
    - type: postgresql
      uri: !env PS_DATABASE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

port: 8080

sync_config:
  path: sync-config.yaml

client_auth:
  jwks_uri: http://host.docker.internal:18100/jwks.json
  audience: ['powersync-proto']

telemetry:
  disable_telemetry_sharing: true

system:
  logging:
    level: info
    format: text
