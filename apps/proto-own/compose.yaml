name: lists

services:
  own-postgres:
    image: postgres:17-alpine
    container_name: own-postgres
    restart: "no"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:15435:5432"
    volumes:
      - own-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  own-pgdata:
    name: own-pgdata
