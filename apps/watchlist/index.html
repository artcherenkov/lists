<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: без него Safari 26 рисует сплошную полосу и тонирует её в зазоре
         между контентом и стеклянными контролами. С ним контент тянется под статус-зону и
         полоску «домой», поэтому экраны сами отступают через env(safe-area-inset-*): без
         метатега эти отступы перестанут работать. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Вотчлист" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Вотчлист</title>
    <!-- Встроенный и синхронный: класс dark должен встать до первой отрисовки, а модуль
         приложения выполняется позже. Если появится CSP, скрипт разрешают по хешу. -->
    <script>
      (() => {
        const systemDark = matchMedia("(prefers-color-scheme: dark)");
        const apply = () => document.documentElement.classList.toggle("dark", systemDark.matches);
        apply();
        systemDark.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <!-- Метка для @lists/sheet: эту обёртку она уводит вглубь, пока открыта шторка.
         min-h-dvh: под обёрткой чёрный body, без полной высоты он проступает снизу.
         will-change-transform держит композитный слой: иначе WebKit создаёт его в момент
         открытия и кадр мелькает. Из-за него fixed-элементы внутри обёртки позиционируются
         от неё, а не от вьюпорта, поэтому плюсик и тостер выносим порталом. -->
    <div id="root" data-sheet-wrapper class="min-h-dvh bg-background will-change-transform"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
