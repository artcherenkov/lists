name: lists
services:
  el-postgres:
    image: postgres:17-alpine
    container_name: el-postgres
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_replication_slots=10",
        "-c",
        "max_wal_senders=10",
      ]
    environment:
      POSTGRES_PASSWORD: proto
      POSTGRES_DB: proto
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["el-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proto"]
      interval: 2s
      retries: 30
  el-electric:
    image: electricsql/electric-temp:1.8.1
    container_name: el-electric
    depends_on:
      el-postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:proto@el-postgres:5432/proto?sslmode=disable
      ELECTRIC_INSECURE: "true"
    ports: ["127.0.0.1:13000:3000"]
    volumes: ["el-electric-data:/app/persistent"]
volumes:
  el-pgdata:
  el-electric-data:
